];

const $=id=>document.getElementById(id);
const search=$("search"),dateFilter=$("dateFilter"),yearFilter=$("yearFilter"),durationFilter=$("durationFilter"),sort=$("sort"),tableBody=$("tableBody"),cards=$("cards"),count=$("count"),modal=$("modal"),categoryButton=$("categoryButton"),categoryMenu=$("categoryMenu");
let selectedCategories=new Set();

function firstScreening(film){return film.screenings[0]}
function dateKey(screening){const p=screening.split(" "),day=p[0],month=p[1],time=p[2],monthNum={Oct:10,Nov:11}[month];return `2026-${String(monthNum).padStart(2,"0")}-${String(day).padStart(2,"0")}T${time}`}
function escapeHTML(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function categoryList(category){
  return category.split("/").map(c=>c.trim()).filter(Boolean);
}
function categoryBadges(category){
  return categoryList(category)
    .map(c=>`<span class="badge">${escapeHTML(c)}</span>`)
    .join(" ");
}

function populateFilters(){
 const dates=[...new Set(films.flatMap(f=>f.screenings.map(s=>s.split(" ")[0]+" "+s.split(" ")[1])))];
 dates.sort((a,b)=>dateKey(a+" 00:00").localeCompare(dateKey(b+" 00:00")));
 dates.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;dateFilter.appendChild(o)});
 const years=[...new Set(films.map(f=>f.year).filter(y=>y!=="—"))];
 years.sort((a,b)=>{if(a==="various")return 1;if(b==="various")return -1;return Number(a)-Number(b)});
 years.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;yearFilter.appendChild(o)});
 const categories=[...new Set(films.flatMap(f=>f.category.split("/").map(c=>c.trim()).filter(Boolean)))];
 categories.sort((a,b)=>a.localeCompare(b));
 categories.forEach(category=>{
   const label=document.createElement("label");label.className="category-option";
   label.innerHTML=`<input type="checkbox" value="${escapeHTML(category)}"><span>${escapeHTML(category)}</span>`;
   const checkbox=label.querySelector("input");
   checkbox.addEventListener("change",()=>{if(checkbox.checked)selectedCategories.add(category);else selectedCategories.delete(category);updateCategoryButton();render()});
   categoryMenu.appendChild(label);
 });
}
function updateCategoryButton(){
 const c=[...selectedCategories];
 categoryButton.textContent=c.length===0?"All categories":c.length===1?c[0]:`${c.length} categories selected`;
}
function matches(film){
 const q=search.value.trim().toLowerCase();
 if(q){const haystack=[film.title,film.year,film.category,film.summary,film.screenings.join(" ")].join(" ").toLowerCase();if(!haystack.includes(q))return false}
 if(dateFilter.value&&!film.screenings.some(s=>s.startsWith(dateFilter.value+" ")))return false;
 if(yearFilter.value&&String(film.year)!==yearFilter.value)return false;
 if(selectedCategories.size>0){const fc=film.category.split("/").map(c=>c.trim());if(![...selectedCategories].some(c=>fc.includes(c)))return false}
 const d=film.duration;
 if(durationFilter.value==="short"&&d>90)return false;
 if(durationFilter.value==="medium"&&(d<91||d>120))return false;
 if(durationFilter.value==="long"&&(d<121||d>150))return false;
 if(durationFilter.value==="verylong"&&d<151)return false;
 return true;
}
function sortScreening(film){if(dateFilter.value){const s=film.screenings.filter(x=>x.startsWith(dateFilter.value+" ")).sort((x,y)=>dateKey(x).localeCompare(dateKey(y)));if(s.length)return s[0]}return firstScreening(film)}
function sortedFilms(){
 const result=films.filter(matches);
 result.sort((a,b)=>{switch(sort.value){case"title":return a.title.localeCompare(b.title);case"year":{const ya=Number(a.year),yb=Number(b.year),na=Number.isNaN(ya),nb=Number.isNaN(yb);if(na!==nb)return na?1:-1;return (na?0:ya-yb)||dateKey(sortScreening(a)).localeCompare(dateKey(sortScreening(b)))||a.title.localeCompare(b.title)}case"duration":return a.duration-b.duration||dateKey(sortScreening(a)).localeCompare(dateKey(sortScreening(b)))||a.title.localeCompare(b.title);default:return dateKey(sortScreening(a)).localeCompare(dateKey(sortScreening(b)))||a.title.localeCompare(b.title)}});return result;
}
function updateFilterBadge(){const n=(dateFilter.value?1:0)+(yearFilter.value?1:0)+(durationFilter.value?1:0)+selectedCategories.size;const b=$("filterBadge");b.textContent=n;b.hidden=n===0}
function render(){updateFilterBadge();
 const result=sortedFilms();count.textContent=`${result.length} ${result.length===1?"title":"titles"}`;tableBody.innerHTML="";cards.innerHTML="";$("tableEmpty").style.display=result.length?"none":"block";
 result.forEach(film=>{
  const tr=document.createElement("tr");tr.innerHTML=`<td>${film.screenings.map(s=>`<span class="screening${dateFilter.value&&s.startsWith(dateFilter.value+" ")?" on-date":""}">${escapeHTML(s)}</span>`).join("")}</td><td><div class="title" data-index="${films.indexOf(film)}">${escapeHTML(film.title)}</div></td><td>${escapeHTML(film.year)}</td><td>${film.duration} min</td><td><div class="category-badges">${categoryBadges(film.category)}</div></td><td><div class="summary">${escapeHTML(film.summary)}</div></td>`;tableBody.appendChild(tr);
  const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="card-title" data-index="${films.indexOf(film)}">${escapeHTML(film.title)}</div><div class="card-meta">${escapeHTML(film.year)} · ${film.duration} min</div><div class="category-badges">${categoryBadges(film.category)}</div><div class="card-meta">${film.screenings.map(x=>dateFilter.value&&x.startsWith(dateFilter.value+" ")?`<strong class="on-date">${escapeHTML(x)}</strong>`:escapeHTML(x)).join(" · ")}</div><div class="card-summary">${escapeHTML(film.summary)}</div>`;cards.appendChild(card);
 });
 document.querySelectorAll("[data-index]").forEach(el=>el.addEventListener("click",()=>openFilm(films[Number(el.dataset.index)])));
}
function openFilm(film){$("modalTitle").innerHTML=film.url?`<a class="film-link" href="${escapeHTML(film.url)}" target="_blank" rel="noopener noreferrer" title="Open on imaginefilmfestival.nl">${escapeHTML(film.title)}<span class="ext" aria-hidden="true"> ↗</span></a>`:escapeHTML(film.title);$("modalInfo").textContent=`${film.year} · ${film.duration} min`;$("modalSummary").textContent=film.summary;$("modalCategory").innerHTML=categoryBadges(film.category);$("modalScreenings").innerHTML=film.screenings.map(s=>`<li>${escapeHTML(s)}</li>`).join("");modal.classList.add("open");document.body.style.overflow="hidden"}
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}
[search,dateFilter,yearFilter,durationFilter,sort].forEach(el=>{el.addEventListener("input",render);el.addEventListener("change",render)});
categoryButton.addEventListener("click",()=>categoryMenu.classList.toggle("open"));
document.addEventListener("click",e=>{if(!e.target.closest(".category-dropdown"))categoryMenu.classList.remove("open")});
$("clear").addEventListener("click",()=>{search.value="";dateFilter.value="";yearFilter.value="";durationFilter.value="";sort.value="date";selectedCategories.clear();categoryMenu.querySelectorAll("input[type='checkbox']").forEach(cb=>cb.checked=false);updateCategoryButton();render()});
$("close").addEventListener("click",closeModal);modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("tableView").addEventListener("click",()=>{$("tableView").classList.add("active");$("cardView").classList.remove("active");document.querySelector(".table-wrap").style.display="";cards.style.display="none"});
$("cardView").addEventListener("click",()=>{$("cardView").classList.add("active");$("tableView").classList.remove("active");document.querySelector(".table-wrap").style.display="none";cards.style.display="grid"});
$("filterToggle").addEventListener("click",()=>{const c=$("filterPanel"),o=c.classList.toggle("open");$("filterToggle").setAttribute("aria-expanded",o)});
populateFilters();render();
</script>
